name: Test Directus locally

on:
  push:
    branches:
      - development

jobs:
  test-directus-local:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Crear docker-compose.yml
      run: |
        cat > docker-compose.yml <<EOF
        version: "3"
        services:
          directus:
            image: directus/directus:11.5.1
            ports:
              - 8055:8055
            volumes:
              - ./database:/directus/database
              - ./uploads:/directus/uploads
              - ./extensions:/directus/extensions
            environment:
              SECRET: "replace-with-random-value"
              ADMIN_EMAIL: "admin@example.com"
              ADMIN_PASSWORD: "d1r3ctu5"
              DB_CLIENT: "sqlite3"
              DB_FILENAME: "/directus/database/data.db"
              WEBSOCKETS_ENABLED: "true"
        EOF

    - name: Levantar Directus con docker-compose
      run: docker compose up -d

    - name: Esperar a que Directus esté listo
      run: |
        for i in {1..30}; do
          curl -s http://localhost:8055/_/health && break
          echo "Esperando a Directus..."
          sleep 5
        done

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar tests
      run: pytest

    - name: Apagar directus
      run: docker compose down
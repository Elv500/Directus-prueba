name: Run Directus Tests

on:
  push:
    branches:
      - development

jobs:
  test-directus:
    runs-on: ubuntu-latest

    services:
      directus:
        image: directus/directus:latest
        ports:
          - 8055:8055
        options: >-
          --health-cmd "curl -f http://localhost:8055/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Wait for Directus to be ready
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:8055/health | grep "healthy" > /dev/null; then
            echo "Directus está listo"
            break
          fi
          echo "Esperando Directus..."
          sleep 5
        done

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: pytest
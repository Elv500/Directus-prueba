name: Run Directus Tests

on:
  push:
    branches:
      - development

jobs:
  test-directus:
    runs-on: ubuntu-latest
    services:
      directus:
        image: directus/directus:latest
        ports:
          - 8055:8055
        options: >-
          --health-cmd="curl --fail http://localhost:8055/_/health || exit 1"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: d1r3ctu5
          DB_CLIENT: sqlite3
          DB_FILENAME: /directus/database/data.db

    steps:
    - uses: actions/checkout@v3

    - name: Esperar a que Directus esté listo
      run: |
        for i in {1..30}; do
          if curl -s http://localhost:8055/_/health; then
            echo "Directus está listo"
            break
          else
            echo "Esperando a Directus..."
            sleep 5
          fi
        done

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar tests
      run: pytest